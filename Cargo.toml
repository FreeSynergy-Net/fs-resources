[workspace]
resolver = "2"
members = [
    "crates/fs-resources-core",
    "crates/fs-resources-server",
    "crates/fs-resources-client",
    "crates/fs-resources-simple",
    "crates/fs-resources-bin",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["FreeSynergy <support@freesynergy.net>"]
repository = "https://github.com/FreeSynergy/fs-resources"
# fs-rpc and fs-components need 1.89.
rust-version = "1.89"
